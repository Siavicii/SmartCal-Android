name: AI Emergency Holidays Updater

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-holidays:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run AI Emergency Holiday Scanner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/ai_holidays_updater.py

      - name: Commit updated holidays.json if changed
        run: |
          git config user.name "SmartCal AI Bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet holidays.json app/src/main/assets/www/holidays.json; then
            git add holidays.json app/src/main/assets/www/holidays.json
            git commit -m "chore(ai): update emergency holidays in holidays.json"
            git push
          else
            echo "No new emergency holidays detected."
          fi
