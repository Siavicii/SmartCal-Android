name: Build SmartCal Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python & Pillow for dynamic icons
        if: hashFiles('generate_icons.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate dynamic icons
        if: hashFiles('generate_icons.py') != ''
        run: |
          python -m pip install --upgrade pip pillow fonttools
          python generate_icons.py

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > app/smartcal-release.jks
          test -s app/smartcal-release.jks

      - name: Grant Gradlew execute permission
        run: chmod +x ./gradlew

      - name: Build signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Remove temporary Keystore
        if: always()
        run: rm -f app/smartcal-release.jks

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCal-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
