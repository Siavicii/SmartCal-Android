name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Fonts & Pillow and Generate 367 Dynamic Icons
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core libraqm-dev curl
          curl -sL https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Black.ttf -o Vazirmatn-Black.ttf
          curl -sL https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf -o Vazirmatn-Bold.ttf
          curl -sL https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-SemiBold.ttf -o Vazirmatn-SemiBold.ttf
          pip install pillow
          python3 generate_icons.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartCal-v62.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
